global
    log stdout format raw local0

    user haproxy
    group haproxy

    maxconn 100

    stats socket /tmp/haproxy.sock mode 660 level admin
    stats timeout 30s

    # --- TLS: профиль Mozilla "Intermediate" ---
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-curves X25519:prime256v1:secp384r1
    # Наборы для TLS 1.3
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    # Наборы для TLS 1.2 (только ECDHE, поэтому параметры DH не нужны)
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305


defaults
    log global

    mode http

    option httplog
    option dontlognull

    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout queue 30s
    timeout tunnel 1h

    option redispatch

    retries 3

frontend https
    # TCP: HTTP/2 и HTTP/1.1 (TLS 1.2 и 1.3)
    bind *:443 ssl crt /certs/localhost.pem alpn h2,http/1.1
    bind [::]:443 v6only ssl crt /certs/localhost.pem alpn h2,http/1.1

    # UDP: HTTP/3 поверх QUIC (всегда TLS 1.3)
    bind quic4@:443 ssl crt /certs/localhost.pem alpn h3
    bind quic6@[::]:443 ssl crt /certs/localhost.pem alpn h3

    # Сообщаем браузерам, что доступен HTTP/3
    http-response set-header alt-svc 'h3=":443"; ma=900'

    # Включайте HSTS, только когда уверены, что весь сайт работает по HTTPS
    http-response set-header Strict-Transport-Security "max-age=31536000"

    # Приложение должно знать, что клиент пришёл по HTTPS
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443

    # Принудительное перенаправление (редирект) с незащищенного HTTP 
    # на защищенный HTTPS-протокол для всех входящих запросов, 
    # которые еще не используют шифрование
    http-request redirect scheme https unless { ssl_fc }
    default_backend app

frontend http
    bind :80
    bind [::]:80
    http-request redirect scheme https code 301

backend app
    # Добавляет X-Forwarded-For с реальным IP клиента
    option forwardfor
    # /up есть в Laravel 11+; для старых версий укажите свой маршрут
    option httpchk
    http-check send meth GET uri /up
    http-check expect status 200

    server app php:8080
